<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Law School</title>
    <meta name="description" content="A 12-week finance-law refresher: study plan, case-law tracker and drafting playbook. Local-first, zero-build." />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2f4a6f" />

    <!--
      Zero-build single-page app. No npm, no bundler, no transpile, no network.
      Double-click this file (file://) or host it on GitHub Pages.
      Preact + htm are vendored locally in /vendor (exact pinned versions) and
      loaded as native ES modules. Seed data is imported (not fetch()ed) so it
      works under file://. Everything runs in the browser; nothing is sent out.
    -->
    <script type="importmap">
      {
        "imports": {
          "preact": "./vendor/preact.module.js",
          "preact/hooks": "./vendor/hooks.module.js",
          "htm": "./vendor/htm.module.js"
        }
      }
    </script>

    <style>
      /* ---- design tokens ---- */
      :root {
        --ink: #1c2024;
        --ink-soft: #4a5158;
        --ink-faint: #7c848c;
        --line: #e3e6ea;
        --line-strong: #cdd3da;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --accent: #2f4a6f;
        --accent-soft: #eaf0f7;
        --green: #2f6f4f;
        --amber: #b7791f;
        --red: #b23b3b;
        --radius: 10px;
        --shadow: 0 1px 2px rgba(20, 30, 45, 0.05), 0 3px 12px rgba(20, 30, 45, 0.06);
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: var(--font);
        color: var(--ink);
        background: var(--bg);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
      p { margin: 0; }
      button { font-family: inherit; cursor: pointer; }
      input, textarea, select { font-family: inherit; }

      .app { min-height: 100vh; display: flex; flex-direction: column; }

      /* ---- topbar ---- */
      .topbar {
        position: sticky; top: 0; z-index: 20;
        display: flex; align-items: center; gap: 20px;
        padding: 12px 24px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: saturate(1.4) blur(8px);
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
      .brand-mark {
        width: 34px; height: 34px; border-radius: 8px;
        display: block; object-fit: contain;
        box-shadow: 0 1px 2px rgba(20, 30, 45, 0.18);
      }
      .brand-title { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
      .brand-sub { font-size: 11px; color: var(--ink-faint); }
      .tabs { display: flex; gap: 4px; margin-left: 8px; }
      .tab {
        border: 0; background: transparent; color: var(--ink-soft);
        padding: 7px 14px; border-radius: 8px; font-size: 14px; font-weight: 550;
      }
      .tab:hover { background: var(--accent-soft); color: var(--accent); }
      .tab-on { background: var(--accent); color: #fff; }
      .tab-on:hover { background: var(--accent); color: #fff; }
      .topbar-right { margin-left: auto; }

      /* ---- bottom tab bar (mobile) ---- */
      .tabbar {
        display: none; /* only shown on narrow screens (see responsive) */
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
        width: 100%;
        padding: 7px 0;
        padding-bottom: calc(7px + env(safe-area-inset-bottom));
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: saturate(1.4) blur(8px);
        border-top: 1px solid var(--line);
      }
      .tabbar-item {
        flex: 1 1 0; min-width: 0; min-height: 40px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 4px;
        border: 0; background: transparent; padding: 0;
        color: var(--ink-faint);
      }
      .tabbar-icon { display: block; width: 24px; height: 24px; }
      .tabbar-label { font-size: 0.58rem; font-weight: 600; line-height: 1; letter-spacing: 0.01em; }
      .tabbar-on { color: var(--accent); }
      .search {
        width: 240px; max-width: 40vw;
        padding: 8px 12px; border: 1px solid var(--line-strong);
        border-radius: 8px; font-size: 13px; background: #fff;
      }
      .search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

      /* ---- layout ---- */
      .main { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: 28px 24px 48px; }
      .module-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
      .module-head h2 { font-size: 24px; }
      .lede { color: var(--ink-soft); font-size: 14px; max-width: 68ch; margin-top: 6px; }

      /* ---- panels ---- */
      .panel {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow);
        margin-bottom: 20px;
      }
      .panel-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin-bottom: 14px; }

      /* ---- progress ---- */
      .progress { margin-bottom: 12px; }
      .progress:last-child { margin-bottom: 0; }
      .progress-head { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; color: var(--ink-soft); }
      .progress-num { color: var(--ink-faint); font-variant-numeric: tabular-nums; }
      .progress-track { height: 7px; background: var(--line); border-radius: 999px; overflow: hidden; }
      .progress-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
      .progress-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 24px; margin-top: 12px; }

      /* ---- toolbar / filters ---- */
      .toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
      .toolbar.wrap { row-gap: 10px; }
      .segmented { display: inline-flex; background: #eef0f3; border-radius: 9px; padding: 3px; }
      .seg { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; font-size: 13px; color: var(--ink-soft); font-weight: 550; }
      .seg-on { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
      .select { padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 13px; background: #fff; }
      .facet { display: inline-flex; align-items: center; gap: 5px; }
      .facet-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-right: 2px; }
      .pill { border: 1px solid var(--line-strong); background: #fff; color: var(--ink-soft); padding: 5px 11px; border-radius: 999px; font-size: 12.5px; }
      .pill:hover { border-color: var(--accent); color: var(--accent); }
      .pill-on { background: var(--accent); border-color: var(--accent); color: #fff; }
      .pill-on:hover { color: #fff; }

      /* ---- cards ---- */
      .cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
      .card {
        background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line-strong);
        border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
        display: flex; flex-direction: column;
      }
      .card.task-done { border-left-color: var(--green); background: #fbfdfb; }
      .card.task-doing { border-left-color: var(--amber); }
      .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
      .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
      .card-title { font-size: 15.5px; margin-bottom: 6px; line-height: 1.3; }
      .card-detail { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 10px; }
      .reslist { margin: 0 0 10px; padding-left: 18px; font-size: 12.5px; color: var(--ink-soft); }
      .reslist li { margin-bottom: 2px; }

      .status-btn { border: 1px solid var(--line-strong); background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
      .status-todo { color: var(--ink-faint); }
      .status-doing { color: var(--amber); border-color: #e6cf9e; background: #fdf8ef; }
      .status-done { color: var(--green); border-color: #b9d8c6; background: #f0f7f2; }

      /* ---- chips ---- */
      .chip {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
        background: #eef0f3; color: var(--ink-soft); white-space: nowrap;
      }
      .chip-muted { background: #eef0f3; color: var(--ink-soft); }
      .chip-ws { background: #eef2f6; color: var(--accent); }
      .chip-case { background: #eef1fa; color: #3a4a8c; }
      .chip-lma { background: #f0f2ee; color: #5a6a3a; }
      .chip-reg { background: #f7eef4; color: #8c3a6a; }
      .chip-market { background: #fbf1e8; color: #8c5a2f; }
      .chip-doc { background: #eaf0f7; color: var(--accent); }
      .chip-custom { background: #efeaf7; color: #6a3a8c; }
      .chip-link, .chip-clause, .chip-task { background: transparent; }
      .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
      .dot-lg { width: 10px; height: 10px; }

      .crosslinks { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
      .chip-btn {
        border: 1px solid var(--line-strong); cursor: pointer; font-size: 11.5px; font-weight: 600;
        padding: 3px 9px; border-radius: 999px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .chip-case.chip-btn { color: #3a4a8c; background: #eef1fa; border-color: #d6ddf2; }
      .chip-clause.chip-btn { color: var(--accent); background: #eaf0f7; border-color: #d3ddea; }
      .chip-task.chip-btn { color: var(--green); background: #f0f7f2; border-color: #cbe2d3; }
      .chip-btn:hover { filter: brightness(0.97); border-color: currentColor; }

      /* ---- notes ---- */
      .notes {
        width: 100%; min-height: 44px; resize: vertical; margin-top: auto;
        border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
        font-size: 13px; color: var(--ink); background: #fcfcfd;
      }
      .notes:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: #fff; }

      /* ---- weeks / workstream blocks ---- */
      .weeks { display: flex; flex-direction: column; gap: 26px; }
      .week-head { font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
      .ws-head { margin-bottom: 12px; }
      .ws-head h3 { font-size: 17px; display: flex; align-items: center; gap: 8px; }
      .ws-summary { font-size: 13px; color: var(--ink-soft); margin-top: 4px; max-width: 78ch; }

      /* ---- kanban ---- */
      .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .kcol { background: #f0f2f5; border-radius: var(--radius); padding: 12px; }
      .kcol-head { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
      .kcount { background: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; }
      .kcol-body { display: flex; flex-direction: column; gap: 10px; }
      .kcard { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: var(--shadow); }
      .kcard-title { font-size: 13.5px; margin: 6px 0 8px; }
      .kmove { display: flex; flex-wrap: wrap; gap: 6px; }
      .kmove-btn { border: 1px solid var(--line-strong); background: #fff; border-radius: 6px; padding: 3px 8px; font-size: 11.5px; color: var(--ink-soft); }
      .kmove-btn:hover { border-color: var(--accent); color: var(--accent); }

      /* ---- accordion (cases + clauses) ---- */
      .acc { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; }
      .acc-open { border-color: var(--line-strong); }
      .acc-head { width: 100%; text-align: left; border: 0; background: transparent; padding: 14px 16px; display: flex; align-items: flex-start; gap: 10px; }
      .acc-head:hover { background: #fafbfc; }
      .acc-caret { color: var(--ink-faint); font-size: 12px; margin-top: 3px; }
      .acc-body { padding: 2px 16px 16px 38px; }

      .caselist { display: flex; flex-direction: column; }
      .case-row-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; width: 100%; }
      .case-row-main { display: flex; flex-direction: column; gap: 3px; }
      .case-title { font-size: 15px; font-weight: 600; }
      .case-cite { font-size: 12.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
      .readbox { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
      .readbox input { width: 15px; height: 15px; }

      .field { margin-bottom: 12px; }
      .field-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-bottom: 3px; }
      .field p { font-size: 13.5px; color: var(--ink); }
      .ask-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 12px; }
      .field.ask { border-left: 3px solid #d6ddf2; padding-left: 10px; }
      .field.push { border-left: 3px solid #e6cf9e; padding-left: 10px; }
      .field.sample { margin-top: 4px; }
      .sample-caveat { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-faint); }
      .sample-text {
        margin: 4px 0 0; padding: 12px 14px; border: 1px solid var(--line);
        border-left: 3px solid var(--accent); border-radius: 8px; background: #f7f9fb;
        font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
        font-size: 12.5px; line-height: 1.55; color: #26333f; white-space: pre-wrap; overflow-x: auto;
      }

      /* ---- playbook ---- */
      .playbook { display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
      .doc-rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 76px; align-self: start; }
      .rail-item { display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; background: transparent; text-align: left; padding: 9px 12px; border-radius: 8px; font-size: 13.5px; color: var(--ink-soft); font-weight: 550; }
      .rail-item:hover { background: var(--accent-soft); color: var(--accent); }
      .rail-on { background: var(--accent); color: #fff; }
      .rail-on:hover { background: var(--accent); color: #fff; }
      .rail-count { font-size: 11.5px; opacity: 0.7; }
      .clause-title { font-size: 15px; font-weight: 600; display: block; margin-top: 4px; }
      .clause-head > div { display: flex; flex-direction: column; gap: 2px; }
      .search-note { font-size: 12.5px; color: var(--ink-faint); margin-bottom: 12px; }
      .mode-note { font-size: 12.5px; color: var(--ink-faint); }

      /* ---- documents module ---- */
      .doc-disclaimer { background: #fbf6ea; border: 1px solid #e8dcbe; color: #6b5a2a; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 18px; }
      .doc-disclaimer strong { color: #5a4a1e; }
      .doc-title { font-size: 17px; margin-bottom: 4px; }
      .doc-summary { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 16px; max-width: 80ch; }
      .doc-group { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); font-weight: 700; margin: 20px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
      .doc-group:first-child { margin-top: 0; }
      .doc-roadmap { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
      .doc-roadmap-head { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-bottom: 6px; }
      .doc-roadmap-item { font-size: 11.5px; color: var(--ink-faint); padding: 3px 0; line-height: 1.4; }
      .badge-doc { background: #f0f2ee; color: #5a6a3a; }

      /* ---- add forms ---- */
      .addform { background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; box-shadow: var(--shadow); }
      .addgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
      .addform label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-soft); font-weight: 600; }
      .addform label.full { margin-bottom: 12px; }
      .addform input, .addform textarea, .addform select { border: 1px solid var(--line-strong); border-radius: 7px; padding: 7px 9px; font-size: 13px; color: var(--ink); }
      .addform input:focus, .addform textarea:focus, .addform select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .addactions { display: flex; justify-content: flex-end; }

      /* ---- buttons ---- */
      .btn { border: 1px solid var(--line-strong); background: #fff; color: var(--ink); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; }
      .btn:hover { border-color: var(--accent); color: var(--accent); }
      .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn-primary:hover { background: #263c5a; color: #fff; }
      .btn-sm { padding: 5px 10px; font-size: 12px; }
      .btn-ghost { border-color: transparent; color: var(--ink-faint); }
      .btn-danger { color: var(--red); border-color: #e0bcbc; }
      .btn-danger:hover { background: #fbf0f0; color: var(--red); border-color: var(--red); }
      .head-actions { display: flex; gap: 8px; }
      .file-btn { position: relative; overflow: hidden; }
      .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

      /* ---- dashboard ---- */
      .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
      .stat { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
      .stat:hover { border-color: var(--accent); }
      .stat-num { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .stat-den { font-size: 18px; color: var(--ink-faint); font-weight: 500; }
      .stat-label { font-size: 14px; font-weight: 600; margin-top: 2px; }
      .stat-sub { font-size: 12.5px; color: var(--ink-faint); margin-top: 2px; }
      .dash-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .nextlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
      .nextlist li { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 7px; cursor: pointer; font-size: 13.5px; }
      .nextlist li:hover { background: var(--accent-soft); }
      .next-wk { font-size: 11.5px; color: var(--ink-faint); width: 38px; white-space: nowrap; }
      .next-title { flex: 1; }
      .all-done { color: var(--green); font-weight: 600; }
      .ws-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
      .ws-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; background: #fff; }
      .ws-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
      .ws-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 14px; }
      .ws-card p { font-size: 12.5px; color: var(--ink-soft); }

      /* ---- global search ---- */
      .gsearch-btn {
        display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong);
        background: #fff; color: var(--ink-soft); padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 550;
      }
      .gsearch-btn:hover { border-color: var(--accent); color: var(--accent); }
      .kbd { font-size: 11px; border: 1px solid var(--line-strong); border-radius: 5px; padding: 1px 5px; color: var(--ink-faint); background: #f6f7f9; }
      .gsearch-backdrop {
        position: fixed; inset: 0; z-index: 50; background: rgba(20, 30, 45, 0.28);
        backdrop-filter: blur(2px); display: flex; align-items: flex-start; justify-content: center; padding: 12vh 16px 16px;
      }
      .gsearch { width: 100%; max-width: 560px; background: #fff; border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 20px 60px rgba(20,30,45,0.25); overflow: hidden; display: flex; flex-direction: column; max-height: 70vh; }
      .gsearch-input { border: 0; border-bottom: 1px solid var(--line); padding: 16px 18px; font-size: 16px; outline: none; color: var(--ink); }
      .gsearch-results { overflow-y: auto; padding: 6px; }
      .gsearch-hint { padding: 22px 16px; text-align: center; color: var(--ink-faint); font-size: 13.5px; }
      .gsearch-group { margin-bottom: 6px; }
      .gsearch-grouphead { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); padding: 8px 12px 4px; }
      .gsearch-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: 8px; cursor: pointer; }
      .gsearch-row:hover { background: var(--accent-soft); }
      .gsearch-badge { flex: none; width: 34px; height: 22px; display: grid; place-items: center; border-radius: 6px; font-size: 11.5px; font-weight: 700; }
      .badge-task { background: #f0f7f2; color: var(--green); }
      .badge-case { background: #eef1fa; color: #3a4a8c; }
      .badge-clause { background: #eaf0f7; color: var(--accent); }
      .gsearch-rowtitle { flex: 1; font-size: 13.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .gsearch-rowsub { flex: none; font-size: 11.5px; color: var(--ink-faint); }
      .gsearch-foot { border-top: 1px solid var(--line); padding: 8px 14px; font-size: 11.5px; color: var(--ink-faint); }
      .focus-flash { animation: flash 1.6s ease; }
      @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: none; } }

      /* ---- misc ---- */
      .empty { text-align: center; color: var(--ink-faint); padding: 40px; font-size: 14px; }
      .footer { border-top: 1px solid var(--line); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--ink-faint); background: #fff; flex-wrap: wrap; }
      .datactl { display: flex; align-items: center; gap: 8px; }
      .datamsg { font-size: 12px; color: var(--green); font-weight: 600; }
      .syncbar { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .syncbar strong { font-weight: 650; color: var(--ink-soft); }
      .syncemail { color: var(--ink-faint); }
      .syncdot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
      .dot-checking { background: var(--line-strong); }
      .dot-syncing { background: var(--amber); animation: pulse 1s ease-in-out infinite; }
      .dot-synced { background: var(--green); }
      .dot-error { background: var(--red); }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

      /* ---- responsive ---- */
      @media (max-width: 860px) {
        .dash-cols, .stat-row, .ask-grid, .kanban { grid-template-columns: 1fr; }
        .playbook { grid-template-columns: 1fr; }
        .doc-rail { flex-direction: row; flex-wrap: wrap; position: static; }
        .tabs { display: none; }
        .topbar { flex-wrap: wrap; }
        /* show the bottom tab bar and reserve space so it doesn't cover content */
        .tabbar { display: flex; }
        .app { padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
      }

      /* ---- print (playbook handout / PDF export) ---- */
      @media print {
        .no-print { display: none !important; }
        body { background: #fff; }
        .main { max-width: none; padding: 0; }
        .acc, .clause .acc { break-inside: avoid; box-shadow: none; border-color: #ccc; }
        .acc-body { display: block !important; padding-left: 16px; }
        .panel, .card { box-shadow: none; }
        .doc-rail { display: none; }
        .playbook { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <noscript>This app needs JavaScript. It runs entirely in your browser — nothing is sent anywhere.</noscript>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
